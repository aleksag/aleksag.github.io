<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gjett hvem – Systek</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-systek">Systek</span>
        <span class="logo-divider"></span>
        <span class="logo-game">Navnespillet</span>
      </div>
      <div class="header-score" id="header-score" hidden>
        <span id="score-display">0 / 0</span>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main-content">

    <!-- SETUP SCREEN -->
    <section id="screen-setup" class="screen active">
      <div class="setup-card">
        <h1>Kjenn dine kolleger</h1>
        <p class="setup-lead">Se et bilde av en Systek-ansatt og gjett hvem det er.</p>
        <div class="setup-options">
          <label class="setup-label">Antall personer i runden:</label>
          <div class="option-group">
            <button class="option-btn active" data-count="all">Alle</button>
            <button class="option-btn" data-count="10">10</button>
            <button class="option-btn" data-count="20">20</button>
            <button class="option-btn" data-count="50">50</button>
          </div>
        </div>
        <button id="start-btn" class="btn-primary" disabled>Laster data…</button>
        <p class="setup-hint" id="setup-hint"></p>
      </div>
    </section>

    <!-- GAME SCREEN -->
    <section id="screen-game" class="screen">
      <div class="game-layout">
        <!-- Left: photo + input -->
        <div class="game-main">
          <div class="progress-bar-wrap">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
          <p class="progress-text" id="progress-text">Spørsmål 1 av 10</p>

          <div class="photo-card">
            <img id="employee-photo" src="" alt="Ansatt" />
          </div>

          <div class="input-wrap">
            <input
              type="text"
              id="name-input"
              class="name-input"
              placeholder="Skriv navn…"
              autocomplete="off"
            />
            <ul id="suggestions" class="suggestions" hidden></ul>
          </div>

          <div class="feedback" id="feedback" hidden></div>
        </div>

        <!-- Right: leaderboard of wrong guesses -->
        <aside class="game-aside">
          <h2 class="aside-title">Mest feilgjettede</h2>
          <ol id="wrong-list" class="wrong-list">
            <li class="empty-state">Ingen feil ennå</li>
          </ol>
          <button id="clear-stats-btn" class="btn-ghost">Slett statistikk</button>
        </aside>
      </div>
    </section>

    <!-- RESULT SCREEN -->
    <section id="screen-result" class="screen">
      <div class="result-card">
        <div class="result-icon" id="result-icon">🎉</div>
        <h1 id="result-heading">Runden er ferdig!</h1>
        <p class="result-score" id="result-score"></p>
        <p class="result-msg" id="result-msg"></p>
        <div class="result-actions">
          <button class="btn-primary" id="play-again-btn">Spill igjen</button>
          <button class="btn-ghost" id="change-setup-btn">Endre innstillinger</button>
        </div>

        <div class="result-wrong" id="result-wrong-wrap" hidden>
          <h2>Dine verste</h2>
          <ol id="result-wrong-list" class="wrong-list"></ol>
        </div>
      </div>
    </section>

  </main>

  <script src="game.js"></script>
</body>
</html>
